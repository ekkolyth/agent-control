name: Release

on:
  push:
    branches: [main]

jobs:
  version:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      desktop_version: ${{ steps.resolve.outputs.desktop_version }}
      desktop_notes: ${{ steps.resolve.outputs.desktop_notes }}
      extension_version: ${{ steps.resolve.outputs.extension_version }}
      extension_notes: ${{ steps.resolve.outputs.extension_notes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      # a merge releases only when it carries a changeset; none means no release
      - name: Resolve version from changesets
        id: resolve
        run: bun apps/desktop/scripts/release/resolve-version.ts

  release:
    needs: version
    if: needs.version.outputs.desktop_version != '' || needs.version.outputs.extension_version != ''
    runs-on: macos-latest
    timeout-minutes: 30
    environment: release
    # one release at a time; a queued run waits rather than cancelling one
    # that may already have pushed its bump
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      # the commit the version job resolved, not whatever main is by now
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          echo "::add-mask::$KEYCHAIN_PW"
          echo "$MACOS_CERT_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          rm -f "$CERT_PATH"

      - name: Prepare notarization key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          P8_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$P8_PATH"
          echo "APPLE_API_KEY_PATH=$P8_PATH" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, release
        env:
          CODESIGN_IDENTITY: 'Developer ID Application: Mike Kenway (WG7D9F39NV)'
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DESKTOP_VERSION: ${{ needs.version.outputs.desktop_version }}
          DESKTOP_NOTES: ${{ needs.version.outputs.desktop_notes }}
          EXTENSION_VERSION: ${{ needs.version.outputs.extension_version }}
          EXTENSION_NOTES: ${{ needs.version.outputs.extension_notes }}
        run: bun apps/desktop/scripts/release/ci-release.ts

      - name: Cleanup
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" || true
